server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: balanca-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/balanca}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins:
      - ${FRONTEND_ORIGIN:http://localhost:5173}
